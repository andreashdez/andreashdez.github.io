# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs checks for pull requests targeting main
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Build site
        run: npm run build
      - name: Validate HTML
        run: npm run quality:html
      - name: Check links, 404 route, and accessibility
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run quality:served
      - name: Lighthouse CI
        run: npm run quality:lighthouse
      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment without blocking pull request checks.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
